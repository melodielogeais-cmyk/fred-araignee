# Fait tourner l'araignée toutes les heures (simulation) et publie le tableau de bord.
# Chaque passage rejoue, minute par minute, les bougies depuis le passage précédent.
name: araignee

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: araignee
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: L'araignée lit le marché
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m araignee run
      - name: Sauvegarde de l'état
        run: |
          git config user.name "araignee-bot"
          git config user.email "araignee-bot@users.noreply.github.com"
          git add data/state.json data/state-journal.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Fred : passage $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase && git push
      - name: Prépare le site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/state.json _site/data/
          [ -f data/backtest.json ] && cp data/backtest.json _site/data/ || true
          [ -f data/ameliorations.json ] && cp data/ameliorations.json _site/data/ || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

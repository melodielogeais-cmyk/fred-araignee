# Fred tourne toutes les 30 minutes (simulation) : il rejoue minute par minute les vraies bougies
# depuis son passage précédent, sauvegarde son état, et met à jour le dossier site/
# (seul dossier publié par l'hébergeur : ni code ni configuration).
name: araignee

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: araignee
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fred lit le marché
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m araignee run
      - name: Met à jour le site
        run: |
          mkdir -p site/data
          cp index.html site/
          cp data/state.json site/data/
          for f in backtest ameliorations; do [ -f data/$f.json ] && cp data/$f.json site/data/ || true; done
      - name: Sauvegarde
        run: |
          git config user.name "fred-bot"
          git config user.email "fred-bot@users.noreply.github.com"
          git add data/state.json site
          [ -f data/state-journal.csv ] && git add data/state-journal.csv || true
          git diff --cached --quiet || git commit -m "Fred : passage $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase && git push
